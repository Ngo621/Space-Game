<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Nova Rebellion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; --f: "Press Start 2P", ui-monospace, Menlo, Consolas, monospace; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #02030a; color: #dfe6ff; font-family: var(--f); overflow: hidden; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; }
  canvas#game { display: block; background: #050714; touch-action: none; image-rendering: pixelated; box-shadow: 0 0 0 2px #1b2a66, 0 0 50px rgba(60,110,255,.35); }
  #overlay { position: absolute; inset: 0; display: flex; overflow-y: auto; background: rgba(3,4,14,.8); padding: 12px; }
  #overlay.hidden { display: none; }
  #inner { margin: auto; display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; text-align: center; }
  h1 { margin: 0; font-size: clamp(18px, 4.6vw, 30px); line-height: 1.3; color: #8fd0ff; text-shadow: 0 0 14px #2f78ff, 0 3px 0 #10286e; letter-spacing: 1px; }
  h2 { margin: 0; font-size: clamp(13px, 3.4vw, 18px); line-height: 1.4; color: #8fd0ff; text-shadow: 0 0 10px #2f78ff; font-weight: normal; }
  .sub { font-size: 8px; line-height: 1.9; color: #ffd36b; }
  .dim { font-size: 7px; line-height: 1.9; color: #8d9ad0; max-width: 420px; }
  .dim i { font-style: normal; color: #ffd36b; }
  .btn { font: inherit; font-size: 11px; width: 250px; padding: 12px 10px; color: #02030a; background: #6bd5ff; border: 0; box-shadow: 0 4px 0 #1f6c9b, 0 0 18px rgba(107,213,255,.5); cursor: pointer; }
  .btn.alt { background: #ffd36b; box-shadow: 0 4px 0 #9b7a1f, 0 0 18px rgba(255,211,107,.4); }
  .btn.ghost { background: #131c4a; color: #9fb0ee; box-shadow: 0 4px 0 #0a1030; }
  .btn:active { transform: translateY(3px); }
  .btn:disabled { opacity: .4; cursor: default; }
  .grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; width: 100%; max-width: 440px; }
  .lv { font: inherit; font-size: 8px; padding: 9px 0; color: #9fb0ee; background: #0a1030; border: 2px solid #26356f; cursor: pointer; }
  .lv.done { color: #6bff9e; border-color: #1f6c4a; }
  .lv.boss { border-color: #ff5b5b; color: #ff9b9b; }
  .lv.cur { background: #12206a; border-color: #6bd5ff; color: #fff; box-shadow: 0 0 10px rgba(107,213,255,.7); }
  .lv:disabled { opacity: .3; cursor: default; }
  .lv.d0 { color: #6bff9e; border-color: #1f6c4a; } .lv.d1 { color: #6bd5ff; border-color: #1f5c8a; } .lv.d2 { color: #ffb347; border-color: #8a5a1f; } .lv.d3 { color: #ff4d8d; border-color: #8a1f4a; }
  .drow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; width: 100%; max-width: 440px; }
  .dbtn { font: inherit; font-size: 7px; padding: 10px 2px; color: #9fb0ee; background: #0a1030; border: 2px solid #26356f; cursor: pointer; }
  .dbtn.sel { color: #02030a; }
  .xpbox { font-size: 12px; color: #ffd36b; padding: 8px 16px; background: #1a1630; border: 2px solid #8a6b1f; box-shadow: 0 0 14px rgba(255,211,107,.25); }
  .sec { align-self: stretch; text-align: left; font-size: 8px; color: #8fd0ff; padding: 6px 4px 4px; border-bottom: 2px solid #1b2a66; margin-top: 4px; }
  .sec.prem { color: #ffd36b; border-color: #8a6b1f; }
  .c2 { width: 100%; background: #0a1030; border: 2px solid #26356f; padding: 10px; display: flex; flex-direction: column; gap: 9px; text-align: left; }
  .c2.sel { border-color: #6bd5ff; box-shadow: 0 0 14px rgba(107,213,255,.5); }
  .c2.prem { border-color: #8a6b1f; background: #151227; }
  .c2.locked canvas { opacity: .95; }
  .top { display: flex; gap: 10px; align-items: center; }
  .top canvas { flex: 0 0 64px; width: 64px; height: 64px; background: #060a20; border: 1px solid #1b2a66; }
  .tt { flex: 1; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .tt b { font-weight: normal; font-size: 12px; color: #fff; }
  .tt span { font-size: 6px; line-height: 1.7; color: #8d9ad0; }
  .badge { align-self: flex-start; font-size: 6px; padding: 3px 6px; background: #1c2556; color: #9fb0ee; }
  .badge.on { background: #6bd5ff; color: #02030a; } .badge.ok { background: #1f6c4a; color: #c6ffe0; } .badge.prem { background: #ffd36b; color: #2a1c00; } .badge.lock { background: #3a1c2a; color: #ff9bb8; }
  .stat { display: flex; align-items: center; gap: 6px; font-size: 6px; color: #8d9ad0; }
  .stat .k { width: 52px; } .stat .v { width: 34px; text-align: right; color: #dfe6ff; }
  .bar { position: relative; flex: 1; height: 7px; background: #141c4a; }
  .bar .f { position: absolute; left: 0; top: 0; bottom: 0; background: #6bd5ff; }
  .bar .n { position: absolute; top: 0; bottom: 0; background: #ffd36b; opacity: .75; }
  .prog { position: relative; height: 8px; background: #141c4a; border: 1px solid #26356f; }
  .prog i { position: absolute; left: 0; top: 0; bottom: 0; background: #ffd36b; }
  .req { font-size: 6px; line-height: 1.8; color: #ffd36b; }
  .acts2 { display: flex; gap: 6px; }
  .acts2 button { flex: 1; font: inherit; font-size: 7px; line-height: 1.6; padding: 9px 4px; color: #02030a; background: #6bd5ff; border: 0; cursor: pointer; }
  .acts2 button.u { background: #ffd36b; }
  .acts2 button.g { background: #1c2556; color: #6e7bb8; }
  .acts2 button:disabled { opacity: .4; cursor: default; }
  .goldbox { font-size: 12px; color: #ffe27a; padding: 8px 16px; background: #1f1a08; border: 2px solid #a07d12; box-shadow: 0 0 14px rgba(255,226,122,.3); }
  .wallet { display: flex; gap: 8px; }
  .wallet .xpbox, .wallet .goldbox { font-size: 10px; padding: 7px 10px; }
  .tt .trait { font-size: 8px; color: #6bd5ff; line-height: 1.5; }
  .tt .descr { font-size: 6px; line-height: 1.8; color: #aab6e8; }
  .seg { display: flex; gap: 2px; flex: 1; }
  .seg i { flex: 1; height: 9px; background: #141c4a; }
  .seg i.on { background: #6bd5ff; } .seg i.nx { background: #ffd36b; }
  .stat .k { width: 56px; } .stat .v { width: 44px; text-align: right; color: #dfe6ff; font-size: 7px; }
  .legend { font-size: 6px; line-height: 1.9; color: #6e7bb8; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; width: 100%; max-width: 450px; }
  .chip { padding: 3px; background: #0a1030; border: 2px solid #26356f; cursor: pointer; line-height: 0; }
  .chip.sel { border-color: #ffd36b; box-shadow: 0 0 10px rgba(255,211,107,.5); }
  .shophead { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px; width: 100%; max-width: 450px; background: #0a1030; border: 2px solid #26356f; }
  .shophead b { font-weight: normal; font-size: 13px; color: #fff; } .shophead span { font-size: 7px; color: #8d9ad0; }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; width: 100%; max-width: 450px; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 4px; background: #0a1030; border: 2px solid #26356f; text-align: center; }
  .tile.sel { border-color: #6bd5ff; box-shadow: 0 0 10px rgba(107,213,255,.5); }
  .tile b { font-weight: normal; font-size: 8px; color: #fff; } .tile span { font-size: 5px; line-height: 1.8; color: #8d9ad0; min-height: 22px; }
  .tile canvas { width: 60px; height: 60px; }
  .tile button { width: 100%; font: inherit; font-size: 6px; line-height: 1.6; padding: 7px 2px; color: #02030a; background: #6bd5ff; border: 0; cursor: pointer; }
  .tile button.u { background: #ffd36b; } .tile button.g { background: #1c2556; color: #6e7bb8; } .tile button:disabled { opacity: .45; cursor: default; }
  .list { width: 100%; max-width: 450px; display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; gap: 10px; align-items: center; padding: 8px; background: #0a1030; border: 2px solid #26356f; text-align: left; }
  .row.sel { border-color: #6bd5ff; box-shadow: 0 0 12px rgba(107,213,255,.5); }
  .row canvas { flex: 0 0 56px; width: 56px; height: 56px; }
  .info { flex: 1; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .info b { font-weight: normal; font-size: 10px; color: #fff; }
  .info span { font-size: 6px; line-height: 1.7; color: #8d9ad0; }
  .info span.req { color: #ffd36b; }
  .pips { display: flex; gap: 3px; }
  .pips i { width: 10px; height: 6px; background: #1c2556; }
  .pips i.on { background: #6bd5ff; }
  .acts { display: flex; flex-direction: column; gap: 5px; }
  .acts button { font: inherit; font-size: 7px; padding: 8px 6px; color: #02030a; background: #6bd5ff; border: 0; cursor: pointer; min-width: 92px; }
  .acts button.u { background: #ffd36b; }
  .acts button:disabled { opacity: .35; cursor: default; }
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="game" width="480" height="720"></canvas>
  <div id="overlay" class="hidden"><div id="inner"></div></div>
</div></div>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const overlay = document.getElementById('overlay');
  const inner = document.getElementById('inner');
  const FONT = '"Press Start 2P", ui-monospace, Menlo, Consolas, monospace';
  try { document.fonts && document.fonts.load('10px "Press Start 2P"'); } catch (e) {}

  function fit() {
    const s = Math.min(window.innerWidth / W, window.innerHeight / H);
    const st = document.getElementById('stage');
    canvas.style.width = Math.floor(W * s) + 'px'; canvas.style.height = Math.floor(H * s) + 'px';
    st.style.width = Math.floor(W * s) + 'px'; st.style.height = Math.floor(H * s) + 'px';
  }
  window.addEventListener('resize', fit); fit();

  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  let muted = false;

  // ---------- Sound ----------
  let audio = null;
  function beep(freq, dur, type = 'square', vol = 0.03, slide = 0) {
    if (muted) return;
    try {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = type; o.frequency.value = freq;
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), audio.currentTime + dur);
      g.gain.value = vol; g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
      o.connect(g); g.connect(audio.destination); o.start(); o.stop(audio.currentTime + dur);
    } catch (e) {}
  }

  // ---------- Speicherstand (Browser + optional Cloud-Sync über die Artifact-DB) ----------
  const SKEY = 'nova-save-v1';
  const defSave = () => ({ v: 1, ts: 0, xp: 0, ship: 'falke', ships: { falke: { u: true, l: 1 } },
    kills: { sichel: 0, zick: 0, waechter: 0, sturm: 0, schwarm: 0, mine: 0, boss: 0 }, storyMax: 1, best: { score: 0, level: 0 }, diff: 1, clr: {}, gold: 0, skins: {} });
  function sanitize(d) {
    const b = defSave(); if (!d || d.v !== 1) return b;
    return Object.assign(b, d, { kills: Object.assign(b.kills, d.kills || {}), best: Object.assign(b.best, d.best || {}), ships: Object.assign(b.ships, d.ships || {}) });
  }
  let SAVE = defSave();
  try { SAVE = sanitize(JSON.parse(localStorage.getItem(SKEY) || 'null')); } catch (e) {}
  let docRef = null;
  function persist() {
    SAVE.ts = Date.now();
    try { localStorage.setItem(SKEY, JSON.stringify(SAVE)); } catch (e) {}
    try { if (docRef) Promise.resolve(docRef.set(JSON.parse(JSON.stringify(SAVE)))).catch(() => {}); } catch (e) {}
  }
  async function initCloud() {
    try {
      if (!window.claude || !window.claude.use) return;
      const user = await window.claude.use('user'), db = await window.claude.use('db');
      if (!user || !db || !user.id) return;
      const id = await user.id();
      docRef = db.collection('data/users/' + id).doc('nova-save');
      const r = await docRef.get();
      let d = r;
      if (r && typeof r.data === 'function') d = (r.exists === false) ? null : r.data();
      if (d && d.v === 1 && (d.ts || 0) > (SAVE.ts || 0)) {
        SAVE = sanitize(d);
        try { localStorage.setItem(SKEY, JSON.stringify(SAVE)); } catch (e) {}
        if (state === 'menu') showMain();
      } else if (!d || (SAVE.ts || 0) > (d.ts || 0)) { if (SAVE.ts) docRef.set(JSON.parse(JSON.stringify(SAVE))); }
    } catch (e) {}
  }

  // ---------- Schiffe der hellen Seite (alle selbst entworfen) ----------
  function mirrored(c, fn) { fn(); c.save(); c.scale(-1, 1); fn(); c.restore(); }
  const SKINFX = { id: 0, neon: '#00f0ff', t: 0 };
  function glowShip(c, col, body) {
    const k = SKINFX;
    c.fillStyle = body; c.strokeStyle = col; c.lineWidth = 2; c.shadowColor = col; c.shadowBlur = 8;
    if (k.id === 1) { // CHROM: spiegelnder Metallglanz
      const g = c.createLinearGradient(-26, -28, 26, 28);
      g.addColorStop(0, '#f6f9ff'); g.addColorStop(0.3, '#8d98b3'); g.addColorStop(0.5, '#eef2ff'); g.addColorStop(0.72, '#5a6480'); g.addColorStop(1, '#d3dcf4');
      c.fillStyle = g; c.strokeStyle = '#ffffff'; c.shadowColor = '#bcd0ff'; c.shadowBlur = 10;
    } else if (k.id === 2) { // NEON: dunkler Rumpf, pulsierende Leuchtkontur
      c.fillStyle = '#04020c'; c.strokeStyle = k.neon; c.shadowColor = k.neon; c.shadowBlur = 14 + 5 * Math.sin(k.t * 0.12); c.lineWidth = 2.6;
    } else if (k.id === 3) { // GOLD: goldener Glanz
      const g = c.createLinearGradient(-26, -28, 26, 28);
      g.addColorStop(0, '#fff0a0'); g.addColorStop(0.3, '#d9a21b'); g.addColorStop(0.5, '#ffe58a'); g.addColorStop(0.75, '#a8740c'); g.addColorStop(1, '#ffd34d');
      c.fillStyle = g; c.strokeStyle = '#fff3b0'; c.shadowColor = '#ffcf33'; c.shadowBlur = 14;
    }
  }
  const fxCv = document.createElement('canvas'); fxCv.width = 110; fxCv.height = 110;
  const fxc = fxCv.getContext('2d');
  // zeichnet ein Schiff mit Skin (0 = Standard, 1 = Chrom, 2 = Neon, 3 = Gold) inkl. Glanz-Effekt
  function drawShipFX(c, sh, skin, t) {
    SKINFX.id = skin || 0; SKINFX.neon = sh.neon; SKINFX.t = t || 0;
    if (!SKINFX.id) { sh.draw(c); return; }
    fxc.setTransform(1, 0, 0, 1, 0, 0); fxc.shadowBlur = 0; fxc.globalCompositeOperation = 'source-over'; fxc.globalAlpha = 1;
    fxc.clearRect(0, 0, 110, 110); fxc.translate(55, 55);
    sh.draw(fxc);
    fxc.shadowBlur = 0;
    if (SKINFX.id === 1 || SKINFX.id === 3) {
      fxc.save(); fxc.globalCompositeOperation = 'source-atop';
      const x = -60 + ((t || 0) * 1.1) % 130;
      const g = fxc.createLinearGradient(x - 10, -30, x + 10, 30);
      g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, 'rgba(255,255,255,.85)'); g.addColorStop(1, 'rgba(255,255,255,0)');
      fxc.fillStyle = g; fxc.fillRect(-55, -55, 110, 110); fxc.restore();
    }
    c.shadowBlur = 0; c.drawImage(fxCv, -55, -55);
    if (SKINFX.id === 3) {
      const pts = [[-12, -8], [13, 4], [0, 16], [-6, 6]];
      pts.forEach((q, i) => {
        const a = Math.max(0, Math.sin((t || 0) * 0.07 + i * 1.7)); if (a < 0.6) return;
        c.strokeStyle = `rgba(255,255,220,${a})`; c.lineWidth = 1.5;
        const r = 2 + a * 4; c.beginPath(); c.moveTo(q[0] - r, q[1]); c.lineTo(q[0] + r, q[1]); c.moveTo(q[0], q[1] - r); c.lineTo(q[0], q[1] + r); c.stroke();
      });
    }
  }
  const SHIPS = [
    { id: 'falke', name: 'FALKE', desc: 'Ausgewogenes Einsteigerschiff', col: '#6bb8ff', speed: 1, cdMul: 1, lives: 0, shield: 0, req: { type: 'free' },
      draw(c) {
        glowShip(c, this.col, '#0c1a3a');
        c.beginPath(); c.moveTo(0, -24); c.lineTo(6, -8); c.lineTo(22, 14); c.lineTo(8, 10); c.lineTo(0, 18); c.lineTo(-8, 10); c.lineTo(-22, 14); c.lineTo(-6, -8); c.closePath(); c.fill(); c.stroke();
        c.shadowBlur = 0; c.fillStyle = this.col; c.beginPath(); c.ellipse(0, -3, 3, 7, 0, 0, 7); c.fill();
      } },
    { id: 'pfeil', name: 'PFEIL', desc: 'Feuert schneller', col: '#a5ff6b', speed: 1, cdMul: 0.8, lives: 0, shield: 0, req: { type: 'kills', key: 'sichel', n: 450, label: '450 SICHEL-JAEGER ZERSTOEREN' },
      draw(c) {
        glowShip(c, this.col, '#0f2205');
        c.beginPath(); c.moveTo(0, -26); c.lineTo(10, 18); c.lineTo(0, 12); c.lineTo(-10, 18); c.closePath(); c.fill(); c.stroke();
        mirrored(c, () => { c.beginPath(); c.rect(12, -2, 6, 22); c.fill(); c.stroke(); });
        c.shadowBlur = 0; c.fillStyle = this.col; c.fillRect(-1.5, -10, 3, 10);
      } },
    { id: 'libelle', name: 'LIBELLE', desc: 'Sehr wendig', col: '#5bffd0', speed: 1.28, cdMul: 1, lives: 0, shield: 0, req: { type: 'gold', cost: 600 },
      draw(c) {
        glowShip(c, this.col, '#06231f');
        mirrored(c, () => {
          c.beginPath(); c.moveTo(3, -9); c.lineTo(25, -14); c.lineTo(25, -9); c.lineTo(3, -3); c.closePath(); c.fill(); c.stroke();
          c.beginPath(); c.moveTo(3, 3); c.lineTo(20, 8); c.lineTo(20, 13); c.lineTo(3, 10); c.closePath(); c.fill(); c.stroke();
        });
        c.beginPath(); c.moveTo(0, -24); c.lineTo(4, -4); c.lineTo(3, 18); c.lineTo(-3, 18); c.lineTo(-4, -4); c.closePath(); c.fill(); c.stroke();
        c.shadowBlur = 0; c.fillStyle = this.col; c.fillRect(-1.5, -14, 3, 8);
      } },
    { id: 'phoenix', name: 'PHOENIX', desc: '+1 Leben', col: '#ffb347', speed: 1, cdMul: 1, lives: 1, shield: 0, req: { type: 'kills', key: 'zick', n: 600, label: '600 ZICK-SCHNEIDER ZERSTOEREN' },
      draw(c) {
        glowShip(c, this.col, '#2a1204');
        mirrored(c, () => { c.beginPath(); c.moveTo(0, -20); c.quadraticCurveTo(16, -10, 26, 14); c.quadraticCurveTo(12, 6, 7, 16); c.lineTo(0, 22); c.closePath(); c.fill(); c.stroke(); });
        c.shadowBlur = 0; c.fillStyle = '#fff2c4'; c.beginPath(); c.ellipse(0, -2, 2.5, 6, 0, 0, 7); c.fill();
      } },
    { id: 'gleiter', name: 'RETRO', desc: 'Schild zu Missionsbeginn', col: '#ff6bd6', speed: 1, cdMul: 1, lives: 0, shield: 300, req: { type: 'gold', cost: 1600 },
      draw(c) {
        const G = ['....X....', '....X....', '...XXX...', '...XOX...', '..XXXXX..', 'X.XXXXX.X', 'XXXXXXXXX', 'X.X.X.X.X'];
        const sk = SKINFX.id, bodyC = sk === 1 ? '#dfe6ff' : sk === 2 ? SKINFX.neon : sk === 3 ? '#ffcf33' : this.col, shadeC = sk === 1 ? '#7f8aa3' : sk === 2 ? '#10061c' : sk === 3 ? '#b8860b' : '#b02a8d';
        c.shadowColor = sk === 2 ? SKINFX.neon : this.col; c.shadowBlur = sk === 2 ? 12 : 6;
        for (let r = 0; r < G.length; r++) for (let q = 0; q < 9; q++) {
          const ch = G[r][q]; if (ch === '.') continue;
          c.fillStyle = ch === 'O' ? '#ffffff' : (r > 5 ? shadeC : bodyC); c.fillRect(-18 + q * 4, -18 + r * 4, 4, 4);
        }
      } },
    { id: 'komet', name: 'KOMET', desc: 'Schnell und feuerstark', col: '#9fe7ff', speed: 1.15, cdMul: 0.85, lives: 0, shield: 0, req: { type: 'kills', key: 'sturm', n: 400, label: '400 STURM-RAMMEN ZERSTOEREN' },
      draw(c) {
        glowShip(c, this.col, '#0a2030');
        c.beginPath(); c.moveTo(0, -30); c.lineTo(5, 2); c.lineTo(11, 20); c.lineTo(0, 13); c.lineTo(-11, 20); c.lineTo(-5, 2); c.closePath(); c.fill(); c.stroke();
        c.shadowBlur = 0; c.fillStyle = '#fff'; c.fillRect(-1, -14, 2, 10);
      } },
    { id: 'bastion', name: 'BASTION', desc: '+2 Leben, traege', col: '#ff8a5b', speed: 0.85, cdMul: 1, lives: 2, shield: 0, req: { type: 'kills', key: 'boss', n: 15, label: '15 KREUZER BESIEGEN' },

  // ---------- Spieler ----------
  function shoot() {

    if (w === 'blaster') {
      const offs = lv === 1 ? [0] : lv === 2 ? [-8, 8] : [-12, 0, 12];
      offs.forEach(o => add(x + o, y, lv === 3 ? o * 0.03 : 0, -11, { col: '#6bd5ff' }));
      beep(900, 0.06, 'square', 0.018, -500);
    } else if (w === 'spread') {
      const n = lv * 2 + 1;
      for (let i = 0; i < n; i++) { const a = -Math.PI / 2 + (i - (n - 1) / 2) * 0.15; add(x, y, Math.cos(a) * 9, Math.sin(a) * 9, { col: '#ffb84d', w: 6, h: 6, life: 42, rnd: true }); }

    } else if (w === 'laser') {

    } else {
      for (let i = 0; i < lv; i++) { const o = i - (lv - 1) / 2; add(x + o * 16, y, o * 0.5, -6, { type: 'm', col: '#ff6b6b', w: 7, h: 14, dmg: 3 * D, accel: 0.25 }); }

  function fireHoming() {

    beep(300, 0.2, 'triangle', 0.04, 400);

  }
  function hurtPlayer() {

    lives--; player.inv = 130; shake = 14;

  }
  function die() {

  }
  function dropPower(x, y, kind0) {
    let kind; const r = Math.random();
    const letter = () => (Math.random() < 0.5 ? player.weapon : WORDER[Math.floor(Math.random() * 4)]);
    const temp = () => { const q = Math.random(); return q < 0.34 ? 'double' : q < 0.62 ? 'rapid' : q < 0.88 ? 'homing' : 'shield'; };
    if (kind0 === 'letter') kind = letter();
    else if (kind0 === 'temp') kind = temp();
    else if (r < 0.52) kind = letter();
    else if (r < 0.93) kind = temp();

  }
  function countKill(type) { const k = type === 'minenleger' ? 'mine' : type; runKills[k] = (runKills[k] || 0) + 1; }
  function killEnemy(e) {
    score += e.score; runXP += e.score / 50; countKill(e.type);

  }
  function killBoss(b) {

  // ---------- Update ----------
  function update() {

    for (const p of particles) { p.x += p.vx; p.y += p.vy; p.life--; }

    if (shake > 0) shake--;
    if (state !== 'play') return;
    if (frame % 1200 === 0) checkpoint();

    let dx = 0, dy = 0;
    if (keys['arrowleft'] || keys['a']) dx -= 1;
    if (keys['arrowright'] || keys['d']) dx += 1;
    if (keys['arrowup'] || keys['w']) dy -= 1;
    if (keys['arrowdown'] || keys['s']) dy += 1;
    const spd = 5 * ST.speed;
    player.x += dx * spd; player.y += dy * spd;
    if (touch) { player.x += clamp((touch.x - player.x) * 0.25, -10, 10); player.y += clamp((touch.y - 60 - player.y) * 0.25, -10, 10); }
    player.x = clamp(player.x, 20, W - 20); player.y = clamp(player.y, 70, H - 30);
    if (player.cd > 0) player.cd--;
    if (player.inv > 0) player.inv--;
    if (player.shield > 0) player.shield--;
    if (player.tDouble > 0) player.tDouble--;
    if (player.tRapid > 0) player.tRapid--;
    if (player.tHoming > 0) { player.tHoming--; if (--player.hcd <= 0) player.hcd = fireHoming() ? 300 : 20; }

    if (bannerT > 0) bannerT--;
    if (warnT > 0) warnT--;
    if (phase === 'waves') {

        spawnT--;

        if (spawnT <= 0) { if (!spawnDone) spawnWave(); spawnT = Math.max(10, Math.round((64 - Math.min(mis.d, 100) * 0.5) * mis.spawnMul * DF.spawn)); }
        if (spawnDone && enemies.length === 0) completeMission();

    }
    if (phase === 'clear') { clearT--; if (clearT <= 0) { levelDone(); if (state !== 'play') return; } }
    for (let i = boomQ.length - 1; i >= 0; i--) {
      const q = boomQ[i]; q.t--;
      if (q.t <= 0) { boom(q.x, q.y, Math.random() < 0.5 ? '#ffb347' : '#ff5b5b', q.big ? 90 : 24, q.big ? 8 : 4.5); beep(rand(70, 140), 0.25, 'sawtooth', 0.05, -30); shake = Math.max(shake, 8); boomQ.splice(i, 1); }
    }

    for (const b of bullets) {

        let t = null, d = 1e9;
        for (const e of enemies) if (e.y > -10) { const dd = Math.hypot(e.x - b.x, e.y - b.y); if (dd < d) { d = dd; t = e; } }
        let ca = Math.atan2(b.vy, b.vx), sp = Math.hypot(b.vx, b.vy);
        if (t) { let da = Math.atan2(t.y - b.y, t.x - b.x) - ca; while (da > Math.PI) da -= 6.283; while (da < -Math.PI) da += 6.283; ca += clamp(da, -0.09, 0.09); }
        sp = Math.min(9, sp + 0.25); b.vx = Math.cos(ca) * sp; b.vy = Math.sin(ca) * sp;

      } else if (b.type === 'm') {
        b.vy = Math.max(-10, b.vy - (b.accel || 0));
        if (frame % 2 === 0) particles.push({ x: b.x, y: b.y + 8, vx: rand(-0.2, 0.2), vy: 1, life: 12, max: 12, col: '#ffb347', sz: 2 });
      }
      b.x += b.vx; b.y += b.vy; b.life--;
      if (b.y < -40 || b.x < -20 || b.x > W + 20 || b.life <= 0) b.dead = true;
    }
    for (const s of ebullets) {
      s.x += s.vx; s.y += s.vy;
      if (s.mine) { s.t++; if (s.t > 110) { s.dead = true; boom(s.x, s.y, '#ffd04d', 14, 3); for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; eshot(s.x, s.y, Math.cos(a) * 2.4, Math.sin(a) * 2.4, '#ffd04d'); } } }
    }
    ebullets = ebullets.filter(s => !s.dead && s.y < H + 20 && s.y > -40 && s.x > -20 && s.x < W + 20);

    for (const e of enemies) {
      e.t++; if (e.flash > 0) e.flash--;
      if (e.type === 'sichel') {
        if (!e.hov) { e.y += e.vy; e.x += e.vx * 0.3; if (e.y >= e.hy) e.hov = true; }
        else { e.x += e.vx * 1.4; e.y = e.hy + Math.sin(e.t * 0.04 + e.id) * 10; }
        if (e.x < 24 || e.x > W - 24) e.vx *= -1;
      }
      else if (e.type === 'zick') {
        if (!e.hov) { e.y += e.vy; if (e.y >= e.hy) e.hov = true; } else e.y = e.hy + Math.sin(e.t * 0.03 + e.id) * 14;
        e.x = clamp(e.base + Math.sin(e.t * 0.06) * 70, 26, W - 26);
      }
      else if (e.type === 'waechter') {
        if (!e.hov) { e.y += e.vy; if (e.y >= e.hy) e.hov = true; } else e.y = e.hy + Math.sin(e.t * 0.02) * 6;
        e.x = clamp(e.base + Math.sin(e.t * 0.015 + e.id) * 90, 30, W - 30);
      }
      else if (e.type === 'schwarm') {
        if (!e.hov) { e.y += e.vy; if (e.y >= e.hy) e.hov = true; }
        else e.y = e.hy + Math.sin(e.t * 0.08 + e.id) * 8;
        e.vx += Math.sign(player.x - e.x) * 0.03; e.vx = clamp(e.vx, -1.2, 1.2); e.x = clamp(e.x + e.vx, 20, W - 20);

      else if (e.type === 'minenleger') {

        else if (e.mode === 'hover') { e.x += Math.sin(e.t * 0.05 + e.id) * 0.8; e.y = e.hy + Math.sin(e.t * 0.07) * 4; if (--e.wait <= 0) { e.mode = 'lock'; e.lock = 30; } }

          e.cd--;
          if (e.cd <= 0) bossAttack(e);
          if (e.burst) {

            if (e.burst.t % 4 === 0) { const a = e.burst.a; eshot(e.x, e.y, Math.cos(a) * 2.8, Math.sin(a) * 2.8, '#ff8a3d'); e.burst.a += 0.5; if (--e.burst.left <= 0) e.burst = null; }
          }

            if (e.minionT <= 0) {

              addEnemy('sichel', 30, 40, true).vx = 1.2; addEnemy('sichel', W - 30, 40, true).vx = -1.2;

        else if (e.type === 'zick') { eshot(e.x, e.y + 12, 0, 3.6); e.cd = rand(80, 150) * e.fm; }
        else if (e.type === 'schwarm') { eshot(e.x, e.y + 8, 0, 3.2, '#5bff9e'); e.cd = rand(180, 340) * e.fm; }

          else if (player.wl[k] < 3) { if (++player.wc[k] >= NEED) { player.wc[k] = 0; player.wl[k]++; beep(880, 0.25, 'triangle', 0.05, 800); shake = 4; } }

        else if (k === 'rapid') player.tRapid = TEMPS.rapid.dur;
        else if (k === 'homing') { player.tHoming = TEMPS.homing.dur; player.hcd = 60; }

    while (powerups.length > 8) powerups.shift();
  }

    for (const [tx, ty] of d.tur) for (const s of [-1, 1]) {
      ctx.fillStyle = '#14101f'; ctx.strokeStyle = d.col; ctx.beginPath(); ctx.arc(s * tx, ty, 6, 0, 7); ctx.fill(); ctx.stroke();
      ctx.fillStyle = d.col; ctx.fillRect(s * tx - 1.5, ty, 3, 11);
    }
    const ey = Math.max(...pts.map(p => p[1]));
    for (const s of [-1, 1]) {
      const g = ctx.createRadialGradient(s * b.w * 0.2, ey, 0, s * b.w * 0.2, ey, 16);
      g.addColorStop(0, 'rgba(255,200,120,.9)'); g.addColorStop(1, 'rgba(255,120,40,0)');
      ctx.fillStyle = g; ctx.fillRect(s * b.w * 0.2 - 16, ey - 16, 32, 32);
    }
    ctx.fillStyle = (Math.floor(b.t / 15) % 2) ? '#ff2a2a' : '#ff7a7a'; ctx.beginPath(); ctx.arc(0, -b.h * 0.22, 6, 0, 7); ctx.fill();
    if (b.flash > 0) { ctx.fillStyle = 'rgba(255,255,255,.55)'; path(); ctx.fill(); }
    ctx.restore();
  }
  function drawRing(b) {
    ctx.save(); ctx.translate(b.x, b.y);
    const R = 88;
    ctx.shadowColor = '#ff8a3d'; ctx.shadowBlur = 16;
    ctx.strokeStyle = '#241a30'; ctx.lineWidth = 26; ctx.beginPath(); ctx.arc(0, 0, R, 0, 7); ctx.stroke();
    ctx.strokeStyle = b.flash > 0 ? '#ffffff' : '#ff8a3d'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, R + 13, 0, 7); ctx.stroke(); ctx.beginPath(); ctx.arc(0, 0, R - 13, 0, 7); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.rotate(b.ang);
    for (let i = 0; i < 12; i++) { ctx.rotate(Math.PI / 6); ctx.fillStyle = '#ff8a3d'; ctx.fillRect(R + 12, -3, 12, 6); ctx.fillStyle = (i % 2) ? '#ffe9a8' : '#4a3a20'; ctx.fillRect(R - 3, -2, 4, 4); }
    ctx.rotate(-b.ang);
    ctx.strokeStyle = '#3a2a4a'; ctx.lineWidth = 8;
    for (let i = 0; i < 4; i++) { const a = i * Math.PI / 2 + Math.PI / 4; ctx.beginPath(); ctx.moveTo(Math.cos(a) * 30, Math.sin(a) * 30); ctx.lineTo(Math.cos(a) * (R - 12), Math.sin(a) * (R - 12)); ctx.stroke(); }
    const pulse = 0.5 + 0.5 * Math.sin(b.t * 0.08), low = b.hp < b.max * 0.5;
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 34);
    g.addColorStop(0, low ? '#ffffff' : '#ffe9a8'); g.addColorStop(0.45, low ? '#ff3b3b' : '#ff8a3d'); g.addColorStop(1, 'rgba(255,60,20,0)');
    ctx.fillStyle = g; ctx.globalAlpha = 0.7 + pulse * 0.3; ctx.beginPath(); ctx.arc(0, 0, 34, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
    ctx.fillStyle = '#1a0606'; ctx.beginPath(); ctx.ellipse(0, 0, 5, 14, 0, 0, 7); ctx.fill();
    ctx.restore();
  }
  function drawPowerup(p) {
    const isW = !!WEAPONS[p.kind];
    const col = isW ? WEAPONS[p.kind].col : TEMPS[p.kind] ? TEMPS[p.kind].col : '#ff6bb0';
    const lbl = isW ? WEAPONS[p.kind].key : TEMPS[p.kind] ? TEMPS[p.kind].lbl : '+';
    const y = p.y + Math.sin(p.t * 0.1) * 3;
    ctx.save(); ctx.translate(p.x, y);
    ctx.shadowColor = col; ctx.shadowBlur = 14; ctx.fillStyle = isW ? '#0a1030' : col; ctx.strokeStyle = col; ctx.lineWidth = 2;
    ctx.beginPath();
    if (isW) { for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; ctx.lineTo(Math.cos(a) * 13, Math.sin(a) * 13); } ctx.closePath(); }
    else ctx.arc(0, 0, 12, 0, 7);
    ctx.fill(); ctx.stroke();
    ctx.shadowBlur = 0; txt(lbl, 1, 1, isW ? 10 : 8, isW ? col : '#06081a', 'center', 'middle');
    ctx.restore();
  }
  function drawPlayer() {
    if (state === 'dead') return;
    if (player.inv > 0 && Math.floor(player.inv / 5) % 2) return;
    ctx.save(); ctx.translate(player.x, player.y);
    ctx.fillStyle = `rgba(255,${160 + Math.random() * 80},70,.9)`;
    ctx.beginPath(); ctx.moveTo(-5, 16); ctx.lineTo(0, 28 + Math.random() * 9); ctx.lineTo(5, 16); ctx.fill();
    drawShipFX(ctx, ST.s, skinOf(ST.s.id), frame);
    if (player.shield > 0) {
      ctx.shadowBlur = 0; ctx.strokeStyle = `rgba(255,211,107,${0.55 + 0.3 * Math.sin(frame * 0.2)})`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, 32, 0, 7); ctx.stroke();
    }
    ctx.restore();
  }

  function draw() {
    ctx.save();
    if (shake > 0) ctx.translate(rand(-shake / 3, shake / 3), rand(-shake / 3, shake / 3));
    ctx.drawImage(neb, 0, nebY); ctx.drawImage(neb, 0, nebY - H);
    for (const s of stars) { ctx.fillStyle = `rgba(210,225,255,${0.25 + s.z * 0.28})`; ctx.fillRect(Math.round(s.x), Math.round(s.y), s.z > 1.6 ? 2 : 1, s.z > 1.6 ? 4 : 2); }

    if (player && (state === 'play' || state === 'pause' || state === 'dead')) {
      for (const p of powerups) drawPowerup(p);
      for (const e of enemies) {
        if (e.type === 'boss') { e.def.ring ? drawRing(e) : drawCruiser(e); continue; }
        ctx.save(); ctx.translate(e.x, e.y);
        if (e.type === 'sichel') drawSichel(ctx, e.t);
        else if (e.type === 'zick') drawZick(ctx);
        else if (e.type === 'waechter') drawWaechter(ctx, e.t);
        else if (e.type === 'schwarm') drawSchwarm(ctx, e.t);
        else if (e.type === 'minenleger') drawMine(ctx, e.t);
        else drawSturm(ctx);
        if (e.flash > 0) { ctx.globalAlpha = 0.6; ctx.fillStyle = '#fff'; ctx.fillRect(-12, -12, 24, 24); }
        ctx.restore();
        if (e.type === 'sturm' && e.mode === 'lock') { ctx.strokeStyle = 'rgba(255,100,60,.35)'; ctx.setLineDash([4, 6]); ctx.beginPath(); ctx.moveTo(e.x, e.y + 16); ctx.lineTo(e.x, H); ctx.stroke(); ctx.setLineDash([]); }
      }
      ctx.shadowBlur = 10;
      for (const b of bullets) {
        ctx.fillStyle = b.col; ctx.shadowColor = b.col;
        if (b.rnd) { ctx.beginPath(); ctx.arc(b.x, b.y, 3, 0, 7); ctx.fill(); }
        else if (b.type === 'm' || b.type === 'h') { ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(Math.atan2(b.vy, b.vx) + Math.PI / 2); ctx.fillRect(-3, -7, 6, 14); ctx.fillStyle = '#fff'; ctx.fillRect(-1, -7, 2, 4); ctx.restore(); }
        else ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);
      }
      for (const s of ebullets) {
        ctx.fillStyle = s.col; ctx.shadowColor = s.col; ctx.beginPath();
        if (s.mine) { const r = 6 + Math.sin(s.t * 0.3 + s.t * s.t * 0.002) * 1.5; ctx.arc(s.x, s.y, r, 0, 7); ctx.fill(); ctx.fillStyle = '#3a2a06'; ctx.fillRect(s.x - 1, s.y - 1, 2, 2); }
        else { ctx.arc(s.x, s.y, 4, 0, 7); ctx.fill(); ctx.fillStyle = '#fff'; ctx.fillRect(s.x - 1, s.y - 1, 2, 2); }
      }
      ctx.shadowBlur = 0;
      drawPlayer();
    }
    for (const p of particles) { ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.col; ctx.fillRect(Math.round(p.x), Math.round(p.y), p.sz, p.sz); }
    ctx.globalAlpha = 1;
    ctx.restore();
    if (player && (state === 'play' || state === 'pause')) drawHUD();
    ctx.drawImage(crt, 0, 0);
  }

  function drawHUD() {
    txt('PUNKTE ' + String(score).padStart(6, '0'), 10, 10, 9, '#dfe6ff');
    txt('XP +' + Math.round(runXP * xpMul()), 10, 24, 7, '#ffd36b');
    if (mode === 'story') txt(DF.name, 10, 36, 6, DF.col); else txt('GOLD +' + runGold, 10, 36, 6, '#ffe27a');
    txt(mode === 'story' ? 'LV ' + level + '/100' : 'ENDLOS ' + level, W - 10, 10, 9, '#8fd0ff', 'right');
    for (let i = 0; i < lives; i++) { ctx.save(); ctx.translate(W - 18 - i * 18, 40); ctx.scale(0.4, 0.4); drawShipFX(ctx, ST.s, skinOf(ST.s.id), frame); ctx.restore(); }
    const boss = enemies.find(e => e.type === 'boss');
    if (boss) {
      const bw = 300, bx = (W - bw) / 2;
      ctx.fillStyle = '#1a1030'; ctx.fillRect(bx, 58, bw, 8);
      ctx.fillStyle = boss.def.col; ctx.fillRect(bx, 58, bw * Math.max(0, boss.hp) / boss.max, 8);
      ctx.strokeStyle = '#ffffff55'; ctx.strokeRect(bx, 58, bw, 8);
      txt(boss.def.name, W / 2, 46, 8, boss.def.col, 'center');
    } else if (phase === 'waves' || phase === 'clear') {
      const bw = 200, bx = (W - bw) / 2;
      const left = enemies.filter(e => e.type !== 'boss').length;
      const timing = mis.type === 'survive' && missionT < mis.time;
      const prog = mis.type === 'survive' ? Math.min(1, missionT / mis.time) : Math.min(1, kills / Math.max(1, need));
      ctx.fillStyle = '#10183a'; ctx.fillRect(bx, 36, bw, 5);
      ctx.fillStyle = '#6bd5ff'; ctx.fillRect(bx, 36, bw * (phase === 'clear' ? 1 : prog), 5);
      txt(timing ? 'ZEIT ' + Math.max(0, Math.ceil((mis.time - missionT) / 60)) + 's' : mis.type === 'survive' ? 'FEINDE UEBRIG ' + left : 'FEINDE ' + Math.min(kills, need) + '/' + need + '  (UEBRIG ' + (need - kills > 0 ? need - kills : left) + ')', W / 2, 46, 7, '#9fb0ee', 'center');
    }
    for (let i = 0; i < 4; i++) {
      const w = WORDER[i], r = slotRect(i), lv = player.wl[w], act = player.weapon === w;
      ctx.fillStyle = act ? '#12206a' : '#0a1030'; ctx.fillRect(r.x, r.y, r.w, r.h);
      ctx.strokeStyle = lv ? WEAPONS[w].col : '#2a3366'; ctx.lineWidth = act ? 3 : 1; ctx.strokeRect(r.x, r.y, r.w, r.h);
      txt(scheme === 'arrows' ? ALT[i] : String(i + 1), r.x + 4, r.y + 4, 6, lv ? '#9fb0ee' : '#3a4380');
      txt(lv ? (lv >= 3 ? 'MAX' : 'L' + lv) : '--', r.x + r.w - 3, r.y + 4, 6, lv ? WEAPONS[w].col : '#3a4380', 'right');
      txt(WEAPONS[w].key, r.x + r.w / 2, r.y + 21, 12, lv ? WEAPONS[w].col : '#3a4380', 'center', 'middle');
      for (let k = 0; k < NEED; k++) { ctx.fillStyle = (lv >= 3 || k < player.wc[w]) ? WEAPONS[w].col : '#1c2556'; ctx.fillRect(r.x + 3 + k * 8.5, r.y + r.h - 6, 7, 3); }
    }
    const fx = [['double', player.tDouble], ['rapid', player.tRapid], ['homing', player.tHoming], ['shield', player.shield]].filter(f => f[1] > 0);
    fx.forEach(([k, v], i) => {
      const T = TEMPS[k], y = H - 22 - i * 20;
      txt(T.name, 10, y - 9, 6, T.col);
      ctx.fillStyle = '#10183a'; ctx.fillRect(10, y, 90, 4);
      ctx.fillStyle = T.col; ctx.fillRect(10, y, 90 * Math.min(1, v / T.dur), 4);
    });
    if (state === 'play') {
      if (bannerT > 0) {
        const a = Math.min(1, bannerT / 30, (190 - bannerT) / 20);
        ctx.globalAlpha = a;
        txt(mode === 'story' ? 'LEVEL ' + level : 'ENDLOS ' + level, W / 2, H * 0.32, 24, '#8fd0ff', 'center');
        txt(mis.text, W / 2, H * 0.32 + 40, 9, mis.type === 'boss' ? BOSSES[mis.bidx].col : '#ffd36b', 'center');
        ctx.globalAlpha = 1;
      }
      if (warnT > 0 && Math.floor(warnT / 12) % 2) {
        txt('! WARNUNG !', W / 2, H * 0.28, 22, '#ff4d4d', 'center');
        txt(BOSSES[mis.bidx].name + ' NAEHERT SICH', W / 2, H * 0.28 + 34, 8, '#ffd36b', 'center');
      }
      if (phase === 'clear') txt(mis.type === 'boss' ? 'KREUZER ZERSTOERT' : 'MISSION ERFUELLT', W / 2, H * 0.36, 14, '#6bff9e', 'center');
    }
  }

  // ---------- Hauptschleife ----------
  let last = performance.now(), acc = 0;
  function loop(now) {
    acc += Math.min(100, now - last); last = now;
    while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
    draw();
    requestAnimationFrame(loop);
  }
  function autosave() { if (state === 'play') { checkpoint(); pause(); } }
  try { if (document.addEventListener) document.addEventListener('visibilitychange', () => { if (document.hidden) autosave(); }); } catch (e) {}
  window.addEventListener('pagehide', () => { if (state === 'play') checkpoint(); });
  showMain();
  initCloud();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
